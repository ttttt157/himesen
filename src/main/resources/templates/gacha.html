<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>ガチャ画面</title>
<link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
<link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">

<style>
/* ===============================
   全体
================================ */
body {
	margin: 0;
	font-family: "Noto Sans JP", sans-serif;
	font-size: 20px;

	background-image: url("/img/gacha.png");
	background-repeat: no-repeat;
	background-size: cover;
	background-position: center center;
	background-attachment: fixed;
}

h1 {
	margin: 32px auto;
	padding: 12px 40px;
	width: fit-content;
	font-size: 34px;
	letter-spacing: 3px;
	text-align: center;
	color: #4a3f37;
	background: rgba(249, 244, 232, 0.85);
	border: 3px solid #c6a86b;
	border-radius: 16px;
	box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 10px 20px rgba(0, 0, 0, 0.35);
}

/* ===============================
   資源エリア（横一列固定・拡大）
================================ */
.resources-container {
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	gap: 32px;
	max-width: 1100px;
	margin: 0 auto 32px auto;
}

.resource-box {
	background: rgba(249, 244, 232, 0.85);
	border: 4px solid #c6a86b;
	border-radius: 18px;
	padding: 28px;
	text-align: center;
	box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2), inset 0 0 6px rgba(0, 0, 0, 0.1);
}

.resource-box label {
	font-size: 20px;
	font-weight: bold;
	margin-bottom: 12px;
	display: block;
}

.resource-input {
	width: 110px;
	font-size: 20px;
	padding: 6px;
	text-align: center;
}

.have-resource {
	margin-top: 12px;
	display: block;
	font-size: 18px;
	font-weight: bold;
}

/* ===============================
   エラー（白枠・視認性向上）
================================ */
.error {
	max-width: 900px;
	margin: 20px auto;
	padding: 16px 24px;
	text-align: center;
	font-weight: bold;
	font-size: 20px;
	color: #c94b3c;
	background: rgba(255, 255, 255, 0.95);
	border: 3px solid #c94b3c;
	border-radius: 12px;
	box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 10px 18px rgba(0, 0, 0, 0.35);
	display: none;
}

/* ===============================
   ガチャボタン（中央・大型）
================================ */
.btn-gacha {
	display: block;
	margin: 48px auto;
	padding: 18px 72px;
	font-size: 26px;
	font-weight: bold;
	border-radius: 18px;
	color: #fff;
	cursor: pointer;
	background: linear-gradient(to bottom, #5a9bd5, #326b9c);
	border: 2px solid rgba(0, 0, 0, 0.35);
	box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 12px 22px rgba(0, 0, 0, 0.5);
}

.btn-gacha:hover:not(:disabled) {
	transform: translateY(-2px);
}

.btn-gacha:active:not(:disabled) {
	transform: translateY(4px);
	box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35), 0 6px 12px rgba(0, 0, 0, 0.45);
}

.btn-gacha:disabled {
	background: linear-gradient(to bottom, #aaa, #777);
}

/* ===============================
   ポップアップ
================================ */
.popup {
	position: fixed;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	width: 420px;
	padding: 32px;
	background: rgba(249, 244, 232, 0.96);
	border: 4px solid #c6a86b;
	border-radius: 20px;
	text-align: center;
	box-shadow: 0 8px 0 rgba(0, 0, 0, 0.35), 0 20px 36px rgba(0, 0, 0, 0.55);
	z-index: 9999;
}
</style>

</head>

<body>

<h1>ガチャ</h1>
<div th:replace="fragments/header :: headerFragment"></div>

<div class="resources-container">
    <div class="resource-box">
        <label>食料</label>
        <input type="number" id="food" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havefood}">0</span> 所持
    </div>
    <div class="resource-box">
        <label>資金</label>
        <input type="number" id="fund" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havefund}">0</span> 所持
    </div>
    <div class="resource-box">
        <label>資材</label>
        <input type="number" id="material" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havematerial}">0</span> 所持
    </div>
</div>

<div class="error" id="range-error">すべての資源は50〜250の範囲で入力してください</div>
<div class="error" id="insufficient-error">資源が足りません</div>

<!-- 中央ガチャボタン -->
<button class="btn-gacha" id="btn-gacha-draw" onclick="drawGacha()">ガチャを引く</button>

<!-- 左下切替ボタン -->
<button
  id="btn-gacha-mode"
  class="btn-gacha"
  onclick="toggleGachaMode()"
  style="position: fixed; bottom: 20px; left: 20px;"
  th:if="${userdata.userinformation == '沖縄県'
       or userdata.userinformation == '演習場1'
       or userdata.userinformation == '演習場2'
       or userdata.userinformation == 'EX1'}">
  通常ガチャ
</button>


<div class="char-info" id="char-info"></div>

<script>
let gachaMode = "normal"; // "normal" or "rare"
let isPopupOpen = false;

function toggleGachaMode() {
    const modeBtn = document.getElementById("btn-gacha-mode");

    if (gachaMode === "normal") {
        gachaMode = "rare";
        modeBtn.innerText = "レアガチャ中";
        ["food", "fund", "material"].forEach(id => {
            const el = document.getElementById(id);
            el.value = 1000;
            el.disabled = true;
        });
    } else {
        gachaMode = "normal";
        modeBtn.innerText = "通常ガチャ中";
        ["food", "fund", "material"].forEach(id => {
            const el = document.getElementById(id);
            el.value = 50;
            el.disabled = false;
        });
    }

    validateResources();
}

function drawGacha() {
    if (!validateResources() || isPopupOpen) return;

    const btn = document.getElementById("btn-gacha-draw");
    btn.disabled = true;

    let fetchUrl, bodyData;
    if (gachaMode === "normal") {
        fetchUrl = "/gacha/draw";
        bodyData = `useFood=${document.getElementById("food").value}&useFund=${document.getElementById("fund").value}&useMaterial=${document.getElementById("material").value}`;
    } else {
        fetchUrl = "/gacha/draw/rare";
        bodyData = null;
    }

    fetch(fetchUrl, {
        method: "POST",
        headers: bodyData ? {"Content-Type": "application/x-www-form-urlencoded"} : {},
        body: bodyData
    })
    .then(response => {
        if (!response.ok) {
            // 資源不足など
            const errorEl = document.getElementById("insufficient-error");
            errorEl.innerText = "資源が足りません";
            errorEl.style.display = "block";
            btn.disabled = false;
            return null;
        }
        return response.json();
    })
    .then(data => {
        if (!data) return;

        const errorEl = document.getElementById("insufficient-error");

        // レアガチャで未入手キャラなし
        if (gachaMode === "rare" && data.message) {
            errorEl.innerText = "レアガチャのキャラクターをコンプリートしました！";
            errorEl.style.display = "block";
            btn.disabled = false;
            return;
        }

        // エラー表示は消す
        errorEl.style.display = "none";
        isPopupOpen = true;

        // レアガチャは固定値
        let hp = gachaMode === "rare" ? 15 : data.initialHp;
        let str = gachaMode === "rare" ? 3 : data.initialStrength;

        const popup = document.createElement('div');
        popup.className = 'popup';
        popup.innerHTML = `
            <h2>${gachaMode === "rare" ? "レア" : "通常"}ガチャ結果！</h2>
            <img src="${data.characterPicture}" width="180">
            <p><strong>${data.characterName}</strong> を入手！</p>
            <p>初期HP: ${hp}<br>初期力: ${str}</p>
            <button id="popupCloseBtn">閉じる</button>
        `;
        document.body.appendChild(popup);

        document.getElementById("popupCloseBtn").addEventListener("click", () => {
            popup.remove();
            isPopupOpen = false;
            validateResources();
            btn.disabled = false;
        });

        document.getElementById("food").nextElementSibling.innerText = data.remainingFood;
        document.getElementById("fund").nextElementSibling.innerText = data.remainingFund;
        document.getElementById("material").nextElementSibling.innerText = data.remainingMaterial;

        validateResources();
    })
    .catch(() => {
        // ネットワークエラーなど
        const errorEl = document.getElementById("insufficient-error");
        errorEl.innerText = "通信エラーが発生しました";
        errorEl.style.display = "block";
        btn.disabled = false;
    });
}


// 資源チェック
function validateResources() {
    let valid = true;

    // レアガチャ中は範囲チェック無視
    if (gachaMode === "rare") {
        document.getElementById("range-error").style.display = "none";
        return true;
    }

    ["food", "fund", "material"].forEach(id => {
        const el = document.getElementById(id);
        const val = parseInt(el.value, 10);
        if (isNaN(val) || val < 50 || val > 250) valid = false;
    });

    document.getElementById("range-error").style.display = valid ? "none" : "block";
    return valid;
}

</script>

</body>
</html>
