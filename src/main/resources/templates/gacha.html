<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>ガチャ画面</title>
<link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
<link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">

<style>
/* ===============================
   全体
================================ */
body {
    margin: 0;
    font-family: "Noto Sans JP", sans-serif;
    font-size: 20px;                 /* ★ 全体拡大 */

    /* ★ ガチャ用背景画像 */
    background-image: url("/img/gacha.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
}


h1 {
    margin: 32px auto;
    padding: 12px 40px;

    width: fit-content;

    font-size: 34px;
    letter-spacing: 3px;
    text-align: center;

    color: #4a3f37;

    /* ★ 和紙風の背景 */
    background: rgba(249, 244, 232, 0.85);
    border: 3px solid #c6a86b;
    border-radius: 16px;

    /* ★ 箱に影を落とす */
    box-shadow:
        0 4px 0 rgba(0,0,0,0.25),
        0 10px 20px rgba(0,0,0,0.35);
}


/* ===============================
   資源エリア（横一列固定・拡大）
================================ */
.resources-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 1100px;              /* ★ 横幅拡張 */
    margin: 0 auto 32px auto;
}

.resource-box {
    background: rgba(249, 244, 232, 0.85);
    border: 4px solid #c6a86b;
    border-radius: 18px;

    padding: 28px;
    text-align: center;

    box-shadow:
        0 6px 14px rgba(0,0,0,0.2),
        inset 0 0 6px rgba(0,0,0,0.1);
}

.resource-box label {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 12px;
    display: block;
}

.resource-input {
    width: 110px;
    font-size: 20px;
    padding: 6px;
    text-align: center;
}

.have-resource {
    margin-top: 12px;
    display: block;
    font-size: 18px;
    font-weight: bold;
}

/* ===============================
   エラー（白枠・視認性向上）
================================ */
.error {
    max-width: 900px;
    margin: 20px auto;
    padding: 16px 24px;

    text-align: center;
    font-weight: bold;
    font-size: 20px;
    color: #c94b3c;

    /* ★ 白枠ボックス化 */
    background: rgba(255, 255, 255, 0.95);
    border: 3px solid #c94b3c;
    border-radius: 12px;

    /* ★ 浮かせて背景と分離 */
    box-shadow:
        0 4px 0 rgba(0,0,0,0.25),
        0 10px 18px rgba(0,0,0,0.35);

    display: none; /* ← 今まで通り */
}


/* ===============================
   ガチャボタン（中央・大型）
================================ */
.btn-gacha {
    display: block;
    margin: 48px auto;

    padding: 18px 72px;
    font-size: 26px;
    font-weight: bold;
    border-radius: 18px;
    color: #fff;
    cursor: pointer;

    background: linear-gradient(to bottom, #5a9bd5, #326b9c);
    border: 2px solid rgba(0,0,0,0.35);

    box-shadow:
        0 6px 0 rgba(0,0,0,0.35),
        0 12px 22px rgba(0,0,0,0.5);
}

.btn-gacha:hover:not(:disabled) {
    transform: translateY(-2px);
}

.btn-gacha:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow:
        0 2px 0 rgba(0,0,0,0.35),
        0 6px 12px rgba(0,0,0,0.45);
}

.btn-gacha:disabled {
    background: linear-gradient(to bottom, #aaa, #777);
}

/* ===============================
   ポップアップ（完成形）
================================ */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 420px;
    padding: 32px;

    background: rgba(249, 244, 232, 0.96);
    border: 4px solid #c6a86b;
    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 8px 0 rgba(0,0,0,0.35),
        0 20px 36px rgba(0,0,0,0.55);

    z-index: 9999;
}
</style>

</head>

<body>

<h1>ガチャ</h1>
<div th:replace="fragments/header :: headerFragment"></div>

<div class="resources-container">
    <div class="resource-box">
        <label>食料</label>
        <input type="number" id="food" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havefood}">0</span> 所持
    </div>
    <div class="resource-box">
        <label>資金</label>
        <input type="number" id="fund" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havefund}">0</span> 所持
    </div>
    <div class="resource-box">
        <label>資材</label>
        <input type="number" id="material" class="resource-input" value="50" oninput="validateResources()">
        <span class="have-resource" th:text="${userdata.havematerial}">0</span> 所持
    </div>
</div>

<div class="error" id="range-error">すべての資源は50〜250の範囲で入力してください</div>
<div class="error" id="insufficient-error">資源が足りません</div>

<button class="btn-gacha" id="btn-gacha" onclick="drawGacha()">ガチャを引く</button>

<div class="char-info" id="char-info"></div>



    <script>
        let isPopupOpen = false; // ★ ポップアップが開いているかどうかのフラグ

        function validateResources() {
            const food = parseInt(document.getElementById("food").value);
            const fund = parseInt(document.getElementById("fund").value);
            const material = parseInt(document.getElementById("material").value);

            const haveFood = parseInt(document.getElementById("food").nextElementSibling.innerText);
            const haveFund = parseInt(document.getElementById("fund").nextElementSibling.innerText);
            const haveMaterial = parseInt(document.getElementById("material").nextElementSibling.innerText);

            const rangeError = document.getElementById("range-error");
            const insufficientError = document.getElementById("insufficient-error");
            const btn = document.getElementById("btn-gacha");

            if (isNaN(food) || food < 50 || food > 250 ||
                isNaN(fund) || fund < 50 || fund > 250 ||
                isNaN(material) || material < 50 || material > 250) {
                rangeError.style.display = "block";
                btn.disabled = true;
                return false;
            } else {
                rangeError.style.display = "none";
            }

            if (food > haveFood || fund > haveFund || material > haveMaterial) {
                insufficientError.style.display = "block";
                btn.disabled = true;
                return false;
            } else {
                insufficientError.style.display = "none";
                btn.disabled = false;
            }

            // ★ ポップアップが開いている間は常にボタン無効化
            if (isPopupOpen) {
                btn.disabled = true;
            }

            return true;
        }

        function drawGacha() {
            if (!validateResources()) return;

            const btn = document.getElementById("btn-gacha");
            btn.disabled = true; // ← ボタン無効化（連打防止）

            const useFood = document.getElementById("food").value;
            const useFund = document.getElementById("fund").value;
            const useMaterial = document.getElementById("material").value;

            fetch("/gacha/draw", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `useFood=${useFood}&useFund=${useFund}&useMaterial=${useMaterial}`
            })
            .then(response => {
                if (!response.ok) {
                    document.getElementById("insufficient-error").style.display = "block";
                    return null;
                }
                document.getElementById("insufficient-error").style.display = "none";
                return response.json();
            })
            .then(data => {
                if (!data) return;

                // ★ ポップアップを開いたフラグON
                isPopupOpen = true;

                // ポップアップ表示
				const popup = document.createElement('div');
				popup.className = 'popup'; // ★ これが最重要
				
				popup.innerHTML = `
				    <h2>ガチャ結果！</h2>
				    <img src="${data.characterPicture}" width="180">
				    <p><strong>${data.characterName}</strong> を入手！</p>
				    <p>初期HP: ${data.initialHp}<br>初期力: ${data.initialStrength}</p>
				    <button id="popupCloseBtn">閉じる</button>
				`;
				
				document.body.appendChild(popup);


                // 閉じるボタンにイベントを設定
                document.getElementById("popupCloseBtn").addEventListener("click", () => {
                    popup.remove();
                    isPopupOpen = false; // ★ ポップアップ閉じたら解除
                    validateResources(); // ← 再度ボタン有効化チェック
                });

                // 所持資源更新
                document.getElementById("food").nextElementSibling.innerText = data.remainingFood;
                document.getElementById("fund").nextElementSibling.innerText = data.remainingFund;
                document.getElementById("material").nextElementSibling.innerText = data.remainingMaterial;

                validateResources();
            })
            .catch(err => {
                console.error(err);
                document.getElementById("insufficient-error").style.display = "block";
            })
            .finally(() => {
                // ★ ポップアップが開いている場合はボタン再有効化しない
                if (!isPopupOpen) {
                    btn.disabled = false;
                }
            });
        }

        // ページロード時に初期値チェック
        validateResources();
    </script>
</body>
</html>
