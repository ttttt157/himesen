<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>プレイヤー一覧</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }
        input[type=text] {
            width: 100px;
        }
        .update-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        .back-btn {
            margin-top: 20px;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            background-color: #2980b9;
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <h2>プレイヤー一覧</h2>
        <button class="back-btn" onclick="location.href='/adminhome'">管理者ホームに戻る</button>

    <table>
        <thead>
            <tr>
                <th>ユーザー名</th>
                <th>パスワード</th>
                <th>食糧</th>
                <th>資金</th>
                <th>資材</th>
                <th>進捗</th>
                <th>変更</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
    <form th:action="@{/updatePlayer}" method="post" style="display:inline-block;">
        <td><input type="text" name="username" th:value="${user.username}" readonly></td>
        <td><input type="text" name="password" th:value="${user.password}"></td>
        <td><input type="text" name="havefood" th:value="${user.havefood}"></td>
        <td><input type="text" name="havefund" th:value="${user.havefund}"></td>
        <td><input type="text" name="havematerial" th:value="${user.havematerial}"></td>
        <td><input type="text" name="userinformation" th:value="${user.userinformation}"></td>
        <td>
            <button type="submit" class="update-btn">変更</button>
    </form>

    <form th:action="@{/deletePlayer}" method="post" style="display:inline-block;">
        <input type="hidden" name="username" th:value="${user.username}">

    </form>
        </td>
</tr>

        </tbody>
    </table>


</body>
</html>
