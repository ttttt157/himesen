<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者ホーム</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .admin-buttons {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            grid-template-rows: repeat(4, 80px);
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-btn {
            font-size: 18px;
            background-color: #2980b9;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 20px 0;
            width: 100%;
            height: 100%;
        }

        .logout-btn {
            font-size: 18px;
            background-color: #c0392b;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 20px 0;
            width: 100%;
            height: 100%;
        }

        form { margin: 0; }
    </style>
</head>
<body>
    <h2>管理者ホーム</h2>

    <div class="admin-buttons">
        <button class="admin-btn" th:onclick="|location.href='@{/playerList}'|">プレイヤー一覧</button>
        <button class="admin-btn" th:onclick="|location.href='@{/admincharactercatalog}'|">図鑑一覧</button>
        <button class="admin-btn" th:onclick="|location.href='@{/adminitemCatalog}'|">アイテム一覧</button>
        <button class="admin-btn" th:onclick="|location.href='@{/adminMapCatalog}'|">マップ一覧</button>
        <button class="admin-btn" th:onclick="|location.href='@{/createCharacter}'|">新規キャラ作成</button>
        <button class="admin-btn" th:onclick="|location.href='@{/createItem}'|">新規アイテム作成</button>
        <button class="admin-btn" th:onclick="|location.href='@{/createMap}'|">新規マップ作成</button>
        
        <!-- 8枠目ログアウト -->
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-btn">ログアウト</button>
        </form>
    </div>
</body>
</html>
