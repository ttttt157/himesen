<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>探索結果</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('/img/battlebackground.png'); 
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: "メイリオ", sans-serif;
            color: white;
            text-align: center;
        }

        /* ★ 全体を薄い黒背景で読みやすく */
        .result-container {
            background: rgba(0, 0, 0, 0.55);
            width: 70%;
            margin: 120px auto 0;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 12px rgba(0, 0, 0, 0.7);
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .reward-item {
            font-size: 23px;
            margin: 8px 0;
        }

        /* ★統一デザインの赤ボタン */
        .back-btn {
            margin-top: 25px;
            width: 220px;
            height: 55px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: linear-gradient(180deg, #ff5555, #cc0000);
            color: white;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.6);
            transition: 0.2s;
        }

        .back-btn:hover {
            background: linear-gradient(180deg, #ff7777, #dd0000);
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <!-- ヘッダー -->
    <div th:replace="fragments/header :: headerFragment"></div>

    <div class="result-container">
        <h1>探索結果</h1>

        <h2>獲得資源</h2>

        <p class="reward-item">資源: <span th:text="${reward['material']}">0</span></p>
        <p class="reward-item">ゴールド: <span th:text="${reward['fund']}">0</span></p>
        <p class="reward-item">食料: <span th:text="${reward['food']}">0</span></p>

        <button class="back-btn" onclick="location.href='/map'">ホームに戻る</button>
    </div>

</body>
</html>
