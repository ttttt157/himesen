<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>戦闘画面</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f4f4f4; overflow-x: hidden; }
        .header { background-color: #333; color: white; padding: 10px; display: flex; justify-content: space-between; }
        .main { display: flex; justify-content: space-between; height: calc(100vh - 60px); padding: 20px; overflow-y: auto; }

        .ally-area, .enemy-area {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 45%;
            justify-content: center;
        }
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    overflow-x: hidden;

    /* ★ 追加：背景画像を敷く */
    background-image: url("/img/battlebackground.png");
    background-size: cover;        /* 全体にフィット */
    background-repeat: no-repeat;  /* 繰り返さない */
    background-position: center;   /* 中央に配置 */
}


        .character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 150px;
            position: relative;
        }

        .character-image {
            width: 150px;
            height: auto;
            object-fit: contain;
        }

        .character-name {
            font-weight: bold;
            margin-top: 5px;
            text-align: center;
        }

        .hp-bar-container {
            width: 100%;
            background: #ccc;
            border-radius: 4px;
            margin-top: 5px;
        }

        .hp-bar {
            height: 20px;
            background: red;
            border-radius: 4px;
            transition: width 0.5s;
        }

        .hp-text {
            text-align: center;
            font-weight: bold;
            margin-top: 2px;
        }

        .damage-text {
            position: absolute;
            font-weight: bold;
            color: yellow;
            font-size: 20px;
            text-shadow: 1px 1px 2px black;
            pointer-events: none;
            opacity: 1;
            animation: jumpFade 1s forwards;
        }

        @keyframes jumpFade {
            0% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-30px); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        .map-info { text-align: center; margin-bottom: 20px; font-size: 24px; }

        /* ====== ここからボタン統一デザイン ====== */
       .common-button {
    padding: 12px 24px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
    background: #2ecc71;
    color: white;
    box-shadow: 0 6px 12px rgba(0,0,0,0.35); /* ← 影を濃く・強く */
    transition: 0.2s;
}

.common-button:hover {
    scale: 1.05;
    background: #28b866;
    box-shadow: 0 8px 16px rgba(0,0,0,0.45); /* ← ホバー時の影も強め */
}


        .common-button:active {
            scale: 0.97;
        }

        #startBattleBtn {
            position: fixed;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #toggleLogBtn {
            position: fixed;
            bottom: 60px;
            right: 20px;
            z-index: 20;
            font-size: 16px;
            padding: 10px 20px;
        }
        /* ====== ボタンデザインここまで ====== */

        #battleLog {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 16px;
            overflow-y: auto;
            padding: 10px;
            transition: height 0.3s ease;
            z-index: 5;
        }

        #battleLog.expanded { height: 400px; }
    </style>
</head>
<body>
<div class="header">
    <div>プレイヤー: <span th:text="${username}"></span></div>
    <div>マップ: <span th:text="${mapName}"></span></div>
</div>

<div class="main">
    <!-- 左側: 味方 -->
    <div class="ally-area">
        <div th:each="ally : ${allies}" class="character-wrapper"
             th:attr="data-id=${ally.ownedCharacterId},data-strength=${ally.strength},data-hp=${ally.hitpoint}">
            <img th:src="@{'/img/' + ${ally.cutinpicture}}" class="character-image" alt="キャラ画像">
            <div class="character-name" th:text="${ally.name}"></div>
            <div class="hp-bar-container">
                <div class="hp-bar" th:style="'width:' + ally.hitpoint + 'px'"></div>
            </div>
            <div class="hp-text" th:text="${ally.hitpoint} + ' HP'"></div>
        </div>
    </div>

    <!-- 右側: 敵 -->
    <div class="enemy-area">
        <div th:each="enemy : ${enemies}" class="character-wrapper"
             th:attr="data-id=${enemy.characterId},data-strength=${enemy.strength},data-hp=${enemy.hitpoint}">
            <img th:src="@{'/img/' + ${enemy.cutinpicture}}" class="character-image" alt="敵キャラ画像">
            <div class="character-name" th:text="${enemy.name}"></div>
            <div class="hp-bar-container">
                <div class="hp-bar" th:style="'width:' + enemy.hitpoint + 'px'"></div>
            </div>
            <div class="hp-text" th:text="${enemy.hitpoint} + ' HP'"></div>
        </div>
    </div>
</div>

<button id="startBattleBtn" class="common-button">戦闘開始</button>
<div id="battleLog"></div>
<button id="toggleLogBtn" class="common-button">拡大</button>

<script>
const allies = Array.from(document.querySelectorAll('.ally-area .character-wrapper'));
const enemies = Array.from(document.querySelectorAll('.enemy-area .character-wrapper'));
const logDiv = document.getElementById('battleLog');

const maxHPMap = new Map();
[...allies, ...enemies].forEach(c => maxHPMap.set(c, parseInt(c.dataset.hp)));

function getHP(wrapper) { return parseInt(wrapper.dataset.hp); }
function setHP(wrapper, hp) {
    hp = Math.max(hp, 0);
    wrapper.dataset.hp = hp;
    const maxHP = maxHPMap.get(wrapper);
    const barWidth = 150 * (hp / maxHP);
    wrapper.querySelector('.hp-bar').style.width = barWidth + 'px';
    wrapper.querySelector('.hp-text').textContent = hp + ' HP';
    wrapper.style.opacity = hp === 0 ? 0.5 : 1;
}

function logBattle(text) {
    logDiv.innerHTML += text + '<br>';
    logDiv.scrollTop = logDiv.scrollHeight;
}

function showDamage(target, dmg) {
    const dmgEl = document.createElement('div');
    dmgEl.className = 'damage-text';
    dmgEl.textContent = dmg;
    target.appendChild(dmgEl);
    setTimeout(() => dmgEl.remove(), 1000);
}

function getAlive(arr) { return arr.filter(c => getHP(c) > 0); }

function attack(attacker, targets) {
    const aliveTargets = getAlive(targets);
    if (!aliveTargets.length) return false;
    const target = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];
    const dmg = parseInt(attacker.dataset.strength);
    const newHP = getHP(target) - dmg;
    setHP(target, newHP);
    showDamage(target, dmg);
    logBattle(`${attacker.querySelector('.character-name').textContent} の攻撃！ ${target.querySelector('.character-name').textContent} に ${dmg} ダメージ！`);
    if (newHP <= 0) logBattle(`${target.querySelector('.character-name').textContent} は戦闘不能！`);
    return true;
}

async function battleLoop() {
    let allyIndex = 0;
    let enemyIndex = 0;

    while (true) {
        const aliveAllies = getAlive(allies);
        const aliveEnemies = getAlive(enemies);

        if (!aliveAllies.length || !aliveEnemies.length) {
            const win = aliveAllies.length > 0;
            const lose = aliveEnemies.length > 0;

            logBattle(win ? '味方の勝利！' : '敗北...');

            const battleState = {
                win: Boolean(win),
                lose: Boolean(lose),
                allies: allies.map(a => ({ id: a.dataset.id, hp: getHP(a) })),
                enemies: enemies.map(e => ({ id: e.dataset.id, hp: getHP(e) })),
                battleLog: logDiv.innerHTML.split('<br>').filter(s => s.trim() !== '')
            };

            await fetch('/battle/saveBattleResult', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(battleState)
            })
            .catch(err => console.error("送信エラー:", err));

            setTimeout(() => window.location.href = '/battle/result', 2000);
            break;
        }

        if (aliveAllies.length && aliveEnemies.length) {
            const attacker = aliveAllies[allyIndex % aliveAllies.length];
            attack(attacker, enemies);
            allyIndex++;
            await new Promise(r => setTimeout(r, 250));
        }

        if (getAlive(enemies).length && getAlive(allies).length) {
            const attacker = getAlive(enemies)[enemyIndex % getAlive(enemies).length];
            attack(attacker, allies);
            enemyIndex++;
            await new Promise(r => setTimeout(r, 250));
        }
    }
}

document.getElementById('startBattleBtn').addEventListener('click', () => {
    document.getElementById('startBattleBtn').style.display = 'none';
    logBattle('戦闘開始！');
    battleLoop();
});

document.getElementById('toggleLogBtn').addEventListener('click', () => {
    logDiv.classList.toggle('expanded')
});
</script>
</body>
</html>
