<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>新規登録</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "メイリオ", sans-serif;
            background-image: url('/img/login.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-card {
            width: 360px;
            background: linear-gradient(145deg, #ffffff, #f0f3f8);
            border: 1px solid #b0b8c8;
            border-radius: 10px;
            padding: 30px 28px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .login-title {
            text-align: center;
            font-size: 80px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
            color: #1f2a44;
            text-shadow:
                0 2px 0 rgba(0,0,0,0.15),
                0 6px 12px rgba(0,0,0,0.2);
            font-family: "游明朝", "ヒラギノ明朝 ProN", "メイリオ", serif;
        }

        .login-subtitle {
            text-align: center;
            font-size: 13px;
            color: #555;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #999;
            font-size: 14px;
            box-sizing: border-box;
        }

        .password-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-btn {
            cursor: pointer;
            font-size: 12px;
            color: #2a4a9e;
            user-select: none;
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px 0;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid #1f3a7a;
            background: linear-gradient(#4b6cb7, #2a4a9e);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 3px 0 #1f3a7a;
        }

        .login-btn:disabled {
            background: #999;
            cursor: not-allowed;
            box-shadow: none;
        }

        .login-btn:hover:enabled {
            background: linear-gradient(#5c7fd1, #3a5bb8);
        }

        .error-msg {
            margin-top: 10px;
            color: #c00000;
            font-size: 13px;
            text-align: center;
        }

        .register-link {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
        }

        .register-link a {
            color: #2a4a9e;
            text-decoration: none;
            font-weight: bold;
        }

        .input-error {
            color: red;
            font-size: 12px;
            display: none;
        }
    </style>
</head>

<body>

<div class="login-card">
    <div class="login-title">新規登録</div>
    <div class="login-subtitle">新規登録情報を入力してください(特殊文字は使用できません)</div>

    <form th:action="@{/register}" method="post" th:object="${user}">
        <!-- ユーザー名 -->
        <div class="form-group">
            <label>ユーザー名</label>
            <input type="text" id="username" th:field="*{username}"
                   placeholder="登録した名前はプレイヤー名としてゲーム内で表示されます"
                   required>
            <div id="usernameError" class="input-error">
                ユーザー名に使用できない文字があります（英数字とアンダースコアのみ）
            </div>
        </div>

        <!-- パスワード -->
        <div class="form-group">
            <label>パスワード</label>
            <div class="password-row">
                <input type="password" id="password" th:field="*{password}" required>
                <span class="toggle-btn" onclick="togglePassword()">表示</span>
            </div>
            <div id="passwordError" class="input-error">
                パスワードに使用できない文字があります（英数字のみ）
            </div>
        </div>

        <button type="submit" id="registerBtn" class="login-btn">登録</button>
    </form>

    <div th:if="${error}" class="error-msg" th:text="${error}"></div>

    <div class="register-link">
        <a th:href="@{/login}">ログイン画面に戻る</a>
    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
}

// リアルタイムバリデーション
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const registerBtn = document.getElementById('registerBtn');
const usernameError = document.getElementById('usernameError');
const passwordError = document.getElementById('passwordError');

// 許可文字
const usernamePattern = /^[a-zA-Z0-9_]*$/; // 英数字＋アンダースコア
const passwordPattern = /^[a-zA-Z0-9]*$/;  // 英数字のみ

function validateInputs() {
    let valid = true;

    if (!usernamePattern.test(usernameInput.value)) {
        usernameError.style.display = 'block';
        valid = false;
    } else {
        usernameError.style.display = 'none';
    }

    if (!passwordPattern.test(passwordInput.value)) {
        passwordError.style.display = 'block';
        valid = false;
    } else {
        passwordError.style.display = 'none';
    }

    registerBtn.disabled = !valid;
}

// イベントリスナー
usernameInput.addEventListener('input', validateInputs);
passwordInput.addEventListener('input', validateInputs);

// ページロード時にもチェック
validateInputs();
</script>

</body>
</html>
