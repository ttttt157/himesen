<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者用アイテム一覧</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <style>
/* テーブル全体 */
table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
    background-color: #fff;
}

/* ヘッダ */
th {
    border: 1px solid #bbb;
    padding: 8px 6px;
    text-align: center;
    background-color: #eaeaea;
    font-size: 13px;
    white-space: nowrap;
}

/* セル */
td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
    font-size: 13px;
    overflow: hidden;
}

/* 行の追跡性 */
tbody tr:nth-child(even) {
    background-color: #fafafa;
}

tbody tr:hover {
    background-color: #eef5ff;
}

/* 入力欄はセルに収める */
input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 4px;
    font-size: 13px;
}

/* 列ごとの幅設計 */
th:nth-child(1),
td:nth-child(1) {
    width: 10%;
    background-color: #f9f9f9;
    font-weight: bold;
}

th:nth-child(2),
td:nth-child(2) {
    width: 20%;
}

th:nth-child(3),
td:nth-child(3) {
    width: 20%;
}

th:nth-child(4),
td:nth-child(4) {
    width: 35%;
}

th:nth-child(5),
td:nth-child(5) {
    width: 15%;
    background-color: #f5f5f5;
}

/* ボタン（色は維持） */
.update-btn {
    background-color: #27ae60;
    color: white;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    margin-bottom: 4px;
}

.delete-btn {
    background-color: #c0392b;
    color: white;
    border: none;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
}

.back-btn {
    margin: 15px 0;
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    background-color: #2980b9;
    color: white;
    border: none;
}

    </style>
</head>
<body>
    <h1>管理者用アイテム一覧</h1>

    <button class="back-btn" th:onclick="|location.href='@{/adminhome}'|">管理ホームに戻る</button>

    <table>
        <thead>
            <tr>
                <th>アイテムID</th>
                <th>アイテム名</th>
                <th>画像</th>
                <th>説明</th>
                <th>変更</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <form th:action="@{/updateItem}" method="post" style="display:inline-block;">
                    <td><input type="text" name="itemId" th:value="${item.itemId}" readonly></td>
                    <td><input type="text" name="itemName" th:value="${item.itemName}"></td>
                    <td><input type="text" name="itemImage" th:value="${item.image}"></td>
                    <td><input type="text" name="itemPicture" th:value="${item.explanation}"></td>
                    <td>
                        <button type="submit" class="update-btn">変更</button>
                </form>

                <form th:action="@{/deleteItem}" method="post" style="display:inline-block;">
                    <input type="hidden" name="itemId" th:value="${item.itemId}" />
                    <button type="submit" class="delete-btn" onclick="return confirm('本当に削除しますか？');">削除</button>
                </form>
                    </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
