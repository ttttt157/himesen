<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アイテム図鑑</title>
    <link rel="icon" type="image/x-icon" th:href="@{/himesenico.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/himesenico.ico}">

<style>
/* ===========================
   背景（ホーム画面と完全統一）
=========================== */
body {
    margin: 0;
    padding: 20px;
    font-family: "Noto Sans JP", sans-serif;

    /* ★ catalog と同じ背景画像 */
    background-image: url("/img/castle.png");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center center;
    background-attachment: fixed;
}


/* 見出し */
h1 {
    margin: 24px auto 30px auto;
    padding: 12px 42px;

    width: fit-content;

    text-align: center;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: 3px;

    color: #4a3f37;

    /* ★ 背景から切り離す */
    background: rgba(255, 253, 246, 0.88);
    border: 3px solid #c6a86b;
    border-radius: 16px;

    /* ★ 箱に影 */
    box-shadow:
        0 4px 0 rgba(0,0,0,0.25),
        0 10px 20px rgba(0,0,0,0.35);
}

/* ===========================
   カタログカード（和紙 + 金枠 + 立体影）
=========================== */
.catalog {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
}

.item-card {
    width: 130px;
    text-align: center;
    padding: 10px;
    border-radius: 12px;

    background: rgba(255, 253, 246, 0.9); /* 和紙系 */
    border: 2px solid #c6a86b; /* 金縁風 */
    box-shadow:
        0 4px 0 rgba(0,0,0,0.25),
        0 6px 12px rgba(0,0,0,0.20);

    cursor: pointer;
    transition: all 0.15s;
}

.item-card:hover {
    transform: translateY(-3px);
    box-shadow:
        0 6px 0 rgba(0,0,0,0.25),
        0 10px 18px rgba(0,0,0,0.20);
}

.item-card:active {
    transform: translateY(3px);
    box-shadow:
        0 1px 0 rgba(0,0,0,0.30),
        0 4px 8px rgba(0,0,0,0.20);
}

.item-card img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
}

/* ===========================
   未所持カード
=========================== */
.not-owned {
    background: rgba(200, 200, 200, 0.5);
    border: 2px solid #aaa;
    cursor: not-allowed !important;
}

.not-owned img { display: none; }

.not-owned div {
    width: 110px;
    height: 110px;
    background: #bfbfbf;
    border-radius: 8px;
    margin: 0 auto;
}

.not-owned p {
    color: #666;
}

/* ===========================
   モーダル（和紙 + 金枠 + 大きな影）
=========================== */
.modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    background: rgba(255, 253, 246, 0.96);
    border: 3px solid #c6a86b;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.35);

    width: 70vw;
    max-width: 900px;
    max-height: 90vh;

    overflow-y: auto;

    display: none;
}

.modal.active {
    display: flex;
    gap: 20px;
    align-items: flex-start;
}

.modal img {
    max-width: 45vw;
    max-height: 80vh;
    object-fit: contain;
    border-radius: 8px;
}

.modal-content {
    max-width: 45vw;
    display: flex;
    flex-direction: column;
    color: #4a3f37;
}

/* ===========================
   モーダルの閉じるボタン（ホーム統一）
=========================== */
.modal-content button {
    align-self: start;
    margin-top: 15px;
    padding: 8px 14px;
    cursor: pointer;

    border-radius: 8px;
    border: 2px solid rgba(0,0,0,0.25);
    background: linear-gradient(to bottom, #5a9bd5, #326b9c);
    color: white;
    font-weight: 600;

    box-shadow:
        0 4px 0 rgba(0,0,0,0.25),
        0 6px 12px rgba(0,0,0,0.20);

    transition: all 0.15s ease-out;
}

.modal-content button:hover {
    transform: translateY(-2px);
    box-shadow:
        0 6px 0 rgba(0,0,0,0.25),
        0 10px 18px rgba(0,0,0,0.20);
}

.modal-content button:active {
    transform: translateY(3px);
    box-shadow:
        0 1px 0 rgba(0,0,0,0.30),
        0 4px 8px rgba(0,0,0,0.20);
}

</style>
</head>
<body>

<h1>アイテム図鑑</h1>

<!-- ヘッダー -->
<div th:replace="fragments/header :: headerFragment"></div>

<div class="catalog">
    <div th:each="item : ${catalog}" class="item-card"
         th:classappend="${!item.owned} ? 'not-owned'"
         th:data-name="${item.itemName}"
         th:data-owned="${item.owned}"
         th:data-image="@{/img/{file}.png(file=${item.image})}"
         th:data-explanation="${item.explanation}">

        <img th:if="${item.owned}" th:src="@{/img/{file}.png(file=${item.image})}" alt="アイテム画像">
        <div th:if="${!item.owned}"></div>
        <p th:text="${item.owned} ? ${item.itemName} : '???'"></p>
    </div>
</div>

<!-- モーダル -->
<div id="modal" class="modal">
    <img id="modalImage" src="" alt="アイテム画像">
    <div class="modal-content">
        <h2 id="modalName"></h2>
        <p id="modalOwned"></p>
        <p id="modalExplanation"></p>
        <button onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
const cards = document.querySelectorAll('.item-card');
const modal = document.getElementById('modal');
const modalImage = document.getElementById('modalImage');
const modalName = document.getElementById('modalName');
const modalOwned = document.getElementById('modalOwned');
const modalExplanation = document.getElementById('modalExplanation');

cards.forEach(card => {
    const isOwned = card.dataset.owned === 'true';

    if (isOwned) {
        card.addEventListener('click', () => {
            modalName.textContent = card.dataset.name;
            modalExplanation.textContent = card.dataset.explanation;
            modalOwned.textContent = "所持済";
            modalImage.src = card.dataset.image;

            modal.classList.add('active');
        });
    }
});

function closeModal() {
    modal.classList.remove('active');
}
</script>

</body>
</html>
